# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: wonderful的自由空间
subtitle: 机遇总是留给有准备之人
description: 好的机遇总是留给有准备之人
author: xiexin
language: zh-CN
timezone:


# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://wonderfulxin.github.io/
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link: true # Open external links in new tab
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/  yilia-plus
theme: yilia-plus

# Deployment
## Docs: https://hexo.io/docs/deployment.html
deploy:
  type: git
  repository: git@github.com:wonderfulxin/wonderfulxin.github.io.git
  branch: master
  
#eploy: 
# type: git
# repository: git@gitee.com:xiexin/xiexin.git
# branch: master

# 新增内容
jsonContent:
  meta: false
  pages: false
  posts:
    title: true
    date: true
    path: true
    text: false
    raw: false
    content: false
    slug: false
    updated: false
    comments: false
    link: false
    permalink: false
    excerpt: false
    categories: false
    tags: true

search:
  path: search.xml
  field: post
githubEmojis:
  enable: true
  className: github-emoji
  inject: true
  styles:
  customEmojis:

# ====================
# 主题配置覆盖 (theme_config)
# 这里的配置会合并到 theme.xxx，覆盖 themes/yilia-plus/_config.yml 中的同名配置
# 参考: https://hexo.io/docs/configuration.html
# ====================
theme_config:
  # GitHub Ribbons 关闭
  github: false

  # 头像
  avatar: /img/avatar.jpg

  # 打赏二维码
  alipay: /img/alipay.jpg
  weixin: /img/weixin.png

  # 打赏设定 (0=关闭, 1=按文章front-matter, 2=所有文章)
  reward_type: 2
  reward_wording: '你的赏识是我前进的动力'

  # 智能菜单 - 关闭友链
  smart_menu:
    friends: false

  # 关于我 - 侧边栏弹窗内容
  aboutme: 主要涉及技术：<br>Java后端开发、Android开发、<br>公众号开发、开源爱好者、Linux<br><br>联系QQ:929992037<br><br>很惭愧<br><br>只做了一点微小的工作<br>谢谢大家

  # 网易云音乐
  music:
    enable: true
    type: 2          # 1=长条 / 2=短条
    id: 1456890009   # 网易云歌曲ID
    autoPlay: false  # 浏览器会阻止自动播放，设为false让用户手动点击
    text: ''

  # 子导航
  subNav:
    - github: "https://github.com/wonderfulxin"
    - weixin: "img/weixin.jpg"
